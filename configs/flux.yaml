seed: 33
do_train: true
log_dir: logs
resume: false
resume_path: ''
task_name: egoverse_flux2_klein9b_qformer_fulltask_hand_concat_v2_2tokens
fabric: false

vision_backbone:
  model_name: vit_large_patch16_dinov3.lvd1689m
  local_ckpt: /workspace/weights/vit_large_patch16_dinov3.lvd1689m/pytorch_model.bin
  pretrained: false

projector:
  type: qformer
  input_token_count: 196
  input_dim: 1024
  num_token: 2
  num_attn_layers: 6
  hidden_dim: 1024
  num_attention_heads: 8
  attention_head_dim: 128
  output_align_dim: 12288

# pose_condition:
#   enabled: true
#   # JointControl-style spatial hand condition concatenated with every 14x14
#   # FLUX noisy-latent token before x_embedder and 4D attention.
#   output_channels: 16
#   train_sidecar: /workspace/STAMO/jsons_egoverse_human_egocentric_all_tasks_12k/train_egoverse_human_bimanual_pose_content_valid_uvz_bond_clean.npy
#   # This sidecar must be generated from the exact JSONL referenced by
#   # data.eval_json_path before starting the production run.
#   eval_sidecar: /workspace/STAMO/jsons_egoverse_human_egocentric_all_tasks_12k/eval_egoverse_fast_6_per_task_pose_uvz_headframe_v5_bond_clean.npy
pose_condition:
  enabled: true
  output_channels: 16
  train_sidecar: /workspace/STAMO/jsons_egoverse_human_egocentric_all_tasks_12k/train_egoverse_human_bimanual_pose_localframe_content_valid_uvz_bond_clean.npy
  eval_sidecar: /workspace/STAMO/jsons_egoverse_human_egocentric_all_tasks_12k/eval_egoverse_fast_human_bimanual_pose_content_valid_uvz_bond_clean.npy

  patch_sigma: 0.75
  depth_mean: 0.0
  depth_scale: 1.0
  depth_hidden_dim: 64
  flip_swap_hands: true
  verify_manifest: true

render_net:
  token_dropout: false
  num_inference_steps: 50
  # Keep the timestep distribution identical to the successful debug run.
  weighting_scheme: none
  logit_mean: 0.0
  logit_std: 1.0
  mode_scale: 1.29
  flux:
    local_ckpt: /workspace/weights/FLUX.2-klein-base-9B
    torch_dtype: bfloat16
    musa_vae_attention_backend: legacy
    guidance_scale: 1.0
    train_transformer: true
    training_mode: full
    gradient_checkpointing: false

data:
  # The production manifest currently contains one line-aligned dataset.
  make_single_dataset: true
  # Keep augmentation identical to the controlled debug run.
  flip_p: 0.0
  img_size: 224
  num_workers: 16
  # The eval manifest contains six frames per task. Fast mode deterministically
  # evaluates 8 tasks (48 images) while retaining correct sidecar row indices.
  eval_mode: fast_mode
  fast_eval_num_tasks: 8
  fast_eval_task_seed: 15
  max_image_read_attempts: 8
  loader_timeout_seconds: 120
  prefetch_factor: 1
  persistent_workers: true
  worker_start_method: spawn
  eval_num_workers: 1
  eval_prefetch_factor: 1
  eval_persistent_workers: false
  read_trace_dir: /tmp/stamo_phase_trace
  read_trace_samples: 0
  # train_json_path: /workspace/STAMO/jsons_egoverse_human_egocentric_all_tasks_12k/train_egoverse_human_bimanual_pose_content_valid.json
  # eval_json_path: /workspace/STAMO/jsons_egoverse_human_egocentric_all_tasks_12k/eval_egoverse_fast_6_per_task.json
  train_json_path: /workspace/STAMO/jsons_egoverse_human_egocentric_all_tasks_12k/train_egoverse_human_bimanual_pose_localframe_content_valid.json
  eval_json_path: /workspace/STAMO/jsons_egoverse_human_egocentric_all_tasks_12k/eval_egoverse_fast_human_bimanual_pose_content_valid.json

train:
  mixed_precision: bf16
  # 8,982,470 / (8 GPUs x 24 images) = 46,784 optimizer steps per epoch.
  epochs: 3
  num_iters: 0
  # Evaluate once per epoch; save intermediate recovery points more often.
  eval_step: 2000
  enable_eval: true
  run_final_eval: true
  enable_checkpointing: true
  save_step: 10000
  local_batch_size: 32
  gradient_accumulate_steps: 1
  # Q-Former and joint Gaussian-splat encoder.
  learning_rate: 0.0003
  # Full FLUX.2 Transformer; keep this below the debug-overfit rate.
  full_transformer_learning_rate: 3e-4
  optimizer_type: adamw
  min_learning_rate: 0.0
  warmup_ratio: 0.001
  decay: 0.001
  constant_lr: true
  ckpt_save_dir: /workspace/datasets/stamo_egoverse_output/ckpts
  deepspeed_zero_stage: 2
  deepspeed_allow_zero2_full_transformer: true
  deepspeed_zero2_min_device_headroom_gib: 32.0
  deepspeed_zero2_host_buffer_factor: 1.5
  gradient_clipping: 0.5
  distributed_timeout_seconds: 600
  deepspeed_overlap_comm: false
  deepspeed_reduce_bucket_size: 200000000
  deepspeed_allgather_bucket_size: 200000000
  deepspeed_offload_optimizer_device: none
  deepspeed_offload_param_device: none
  deepspeed_exclude_frozen_parameters: true
  deepspeed_skip_model_broadcast: true
  save_renderer_export: false
  save_full_transformer_export: false
  log_interval: 20
  max_eval_images_to_save: 32
  eval_grid_pairs: 6
  save_eval_images_all_ranks: false
  phase_trace: false
  phase_trace_steps: 20
  phase_trace_dir: /tmp/stamo_phase_trace
  hang_dump_after_seconds: 0
  phase_trace_synchronize: false
  verify_step_numerics: false
  verify_parameter_updates: false
  abort_on_nonfinite_loss: true
